<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">A small, ready-to-learn home office</title>
  <desc id="description">A warm desk with a plant to the left of a computer, an upright coffee cup, a clearly outlined keyboard, and a small computer running a private practice environment.</desc>
  <defs>
    <linearGradient id="wall" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#132c49"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#9a6844"/>
      <stop offset="1" stop-color="#503a32"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1b4264"/>
      <stop offset="1" stop-color="#10243b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#wall)"/>
  <circle cx="960" cy="106" r="205" fill="#04a7a4" opacity=".12"/>
  <circle cx="210" cy="180" r="160" fill="#2d6dc3" opacity=".12"/>
  <rect x="0" y="458" width="1200" height="217" fill="url(#desk)"/>
  <path d="M0 462h1200" stroke="#d3a273" stroke-width="8" opacity=".6"/>
  <path d="M170 458v175m860-175v175" stroke="#362c2a" stroke-width="18"/>
  <path d="M90 457h1020" stroke="#c28b5d" stroke-width="2" opacity=".65"/>

  <!-- Plant stays clear of the computer. -->
  <path d="M130 455c8-100 14-148 20-206m-19 97c-52-28-76-58-82-94 45 4 76 25 91 62m-86 2c48-6 79-2 101 21m-67-104c22-43 50-65 86-70 2 47-15 80-53 101m21 84c28-34 60-50 98-50-14 40-40 65-77 76" fill="none" stroke="#04a7a4" stroke-linecap="round" stroke-linejoin="round" stroke-width="15"/>
  <path d="M88 450h116l-13 72h-90z" fill="#2d6dc3" stroke="#8fb9ff" stroke-width="4"/>

  <!-- Monitor and quiet practice workspace. -->
  <rect x="348" y="108" width="490" height="302" rx="18" fill="#0b1220" stroke="#8fb9ff" stroke-width="5"/>
  <rect x="366" y="126" width="454" height="266" rx="8" fill="url(#screen)"/>
  <path d="M430 184h236m-236 36h322m-322 36h184m-184 36h264m-264 36h212" stroke="#8fb9ff" stroke-linecap="round" stroke-width="9" opacity=".72"/>
  <circle cx="778" cy="158" r="8" fill="#04a7a4"/>
  <path d="M529 410v40m-66 10h198" stroke="#b6d1ff" stroke-linecap="round" stroke-width="11"/>
  <rect x="888" y="281" width="131" height="159" rx="12" fill="#17345b" stroke="#8fb9ff" stroke-width="4"/>
  <path d="M911 309h84m-84 25h84m-84 25h84" stroke="#04a7a4" stroke-width="7" stroke-linecap="round"/>
  <circle cx="1003" cy="419" r="5" fill="#d4773b"/>

  <!-- Keyboard outline, no named or labeled keys. -->
  <path d="M329 482 819 482l-31 93H301z" fill="#12243a" stroke="#dce8f8" stroke-width="4" stroke-linejoin="round"/>
  <g fill="none" stroke="#8fb9ff" stroke-width="3" opacity=".9">
    <path d="m354 499 55 0m-65 19 54 0m-62 19 53 0m-59 19 53 0"/>
    <path d="m426 499 55 0m-60 19 55 0m-64 19 54 0m-62 19 53 0"/>
    <path d="m498 499 55 0m-60 19 55 0m-63 19 54 0m-61 19 53 0"/>
    <path d="m570 499 55 0m-59 19 54 0m-62 19 53 0m-61 19 53 0"/>
    <path d="m642 499 55 0m-59 19 54 0m-62 19 53 0m-60 19 52 0"/>
    <path d="m714 499 55 0m-60 19 55 0m-62 19 54 0m-60 19 53 0"/>
  </g>
  <path d="M478 557h200" stroke="#d4773b" stroke-width="7" stroke-linecap="round"/>

  <!-- Upright cup, set safely apart from the keyboard. -->
  <path d="M920 467h124l-13 103c-3 20-18 33-38 33h-24c-20 0-35-13-38-33z" fill="#f3e7d4" stroke="#8fb9ff" stroke-width="4"/>
  <path d="M1044 490h20c19 0 29 12 27 29-3 23-19 38-42 38" fill="none" stroke="#f3e7d4" stroke-width="12"/>
  <path d="M946 480h72" stroke="#d4773b" stroke-width="5" stroke-linecap="round"/>
  <path d="M956 444c-12-19 14-21 4-41m35 40c-12-19 14-21 4-41" fill="none" stroke="#c5cedb" stroke-linecap="round" stroke-width="5" opacity=".7"/>
  <path d="M873 615h252" stroke="#8fb9ff" stroke-width="3" opacity=".5"/>
  <text x="90" y="85" fill="#f2f6fd" font-family="Inter, sans-serif" font-size="21" letter-spacing="4">LEARN · TEST · KEEP CONTROL</text>
</svg>
